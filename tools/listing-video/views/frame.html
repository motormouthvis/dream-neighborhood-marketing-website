<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Listing video frame</title>
    <style>
      :root {
        --dn-green: #1f7a4d;
        --dn-green-dark: #17493a;
        --ink: #16202b;
        --ink-soft: #5b6b7b;
        --line: #e3e8ee;
        --amber: #f0932b;
        --red: #e0396b;
        --green: #2fa96b;
        --grey: #9aa7b4;
        --purple: #6d5bd0;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
        font-family: Inter, "Liberation Sans", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f2f4f6; }

      /* ---------- captured website ---------- */
      #bg { position: absolute; top: 0; left: 0; width: 1920px; display: block; }

      /*
       * The listing behind an explorer card is DIMMED, not bleached.
       *
       * This was rgba(255,255,255,0.5) - a white wash. The listing went pale and
       * a white card sitting on it had no edge to see, so the popup read as a
       * faint rectangle rather than something open on top of the page. A real
       * modal darkens what is behind it.
       */
      #scrim {
        position: absolute; inset: 0;
        background: rgba(10, 22, 17, 0.55);
        opacity: 0;
        transition: none;
      }
      #stage.has-card #scrim { opacity: 1; }

      /* ---------- top caption bar (never a bottom bar: it would cover the popup) ---------- */
      #caption {
        position: absolute; top: 0; left: 0; right: 0; height: 112px;
        background: rgba(26, 56, 43, 0.9);
        padding: 16px 48px 0;
        display: flex; flex-direction: column; justify-content: center;
      }
      /* A beat can leave the caption empty; the bar goes with it. */
      #stage.no-caption #caption { display: none; }
      #caption h1 {
        color: #ffffff; font-size: 44px; font-weight: 800; letter-spacing: -0.6px;
        line-height: 1.08; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #caption p {
        color: rgba(255, 255, 255, 0.86); font-size: 23px; font-weight: 600;
        margin-top: 8px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ---------- popup button, bottom right ---------- */
      #popup {
        position: absolute; right: 40px; bottom: 40px;
        display: flex; align-items: center; gap: 18px;
      }
      #tooltip {
        background: #ffffff; color: #1d2b36; font-size: 25px; font-weight: 600;
        padding: 17px 30px; border-radius: 999px;
        box-shadow: 0 10px 34px rgba(15, 23, 42, 0.22);
        white-space: nowrap; max-width: 1200px; overflow: hidden; text-overflow: ellipsis;
      }
      #house {
        width: 86px; height: 86px; border-radius: 50%;
        background: linear-gradient(180deg, #24855a 0%, #17604180 100%), #1c7148;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 30px rgba(14, 68, 46, 0.4);
        flex: 0 0 auto;
      }
      #house svg { width: 44px; height: 44px; }
      #popup.is-tapping #house {
        box-shadow: 0 0 0 14px rgba(31, 122, 77, 0.28), 0 12px 30px rgba(14, 68, 46, 0.45);
        transform: scale(1.06);
      }
      #stage.hide-popup #popup { display: none; }

      /*
       * A bare listing beat is JUST their page.
       *
       * Everything of ours goes away here - the house button and its label, any
       * popup card, and the dim behind one - and it is written as its own rule
       * rather than left to the spec being right, because the spec being right
       * is exactly what kept failing. Bill saw the School Explorer button on the
       * beats that say "there's nothing here about schools" three times over.
       *
       * The caption bar stays: it is the script's own words, not our product.
       */
      #stage.bare-listing #popup,
      #stage.bare-listing #card,
      #stage.bare-listing #scrim { display: none !important; }

      /* ---------- explorer card ---------- */
      #card {
        position: absolute; left: 290px; top: 208px; width: 1340px; height: 764px;
        background: #f6f7f5; border-radius: 16px;
        box-shadow: 0 40px 90px rgba(12, 26, 20, 0.32), 0 2px 0 rgba(255, 255, 255, 0.6) inset;
        overflow: hidden; display: none;
      }
      #stage.has-card #card { display: block; }

      /*
       * Neighborhood Explorer gets a bigger card, because its tabs are dense with
       * numbers and small text and the old one read as washed out on a screen.
       *
       * 1600x700 is the size its shots are taken at (src/explorer.js), at twice
       * the pixels, so the picture maps one to one and is simply sharper. The
       * shape follows the widget's own content, which lays out about 664px tall
       * at this width - a taller card would only add white space, and that is
       * what made the popup look small. The right edge stops short of the house
       * button in the corner.
       */
      /*
       * Neighborhood Explorer is drawn as the popup it is: a header with the
       * brand and a way out, then the widget, inside a bordered card with a
       * strong shadow. The shots are of the inner widget only (popup=true), so
       * without this there is no header and no X anywhere in the video.
       *
       * Chrome only. No tabs and no data are invented here - everything inside
       * the frame is the photograph of the real product.
       */
      #card.card--ne {
        /*
         * content-box, so the width really is the width the shot is taken at and
         * the border sits outside it. With the default border-box the picture was
         * scaled by a percent to fit inside the border, which softened the text
         * this change exists to sharpen.
         */
        box-sizing: content-box;
        left: 150px; top: 168px; width: 1600px; height: 780px;
        background: #ffffff;
        border: 1px solid rgba(12, 30, 22, 0.22);
        border-radius: 20px;
        box-shadow:
          0 48px 120px rgba(4, 14, 9, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      }
      /*
       * School Explorer is the same shape, because it is the same popup on the
       * same page: 1600x700 of photographed product under a header of its own.
       * The two cards cut between each other in the upgrade script, and a popup
       * that changed size and place between beats would read as two products.
       */
      #card.card--se {
        box-sizing: content-box;
        left: 150px; top: 168px; width: 1600px; height: 780px;
        background: #ffffff;
        border: 1px solid rgba(12, 30, 22, 0.22);
        border-radius: 20px;
        box-shadow:
          0 48px 120px rgba(4, 14, 9, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      }
      /* No tint or fade over the shot: the text in it has to stay readable. */
      #card.card--ne::after, #card.card--se::after { content: none; }

      .ne__head {
        height: 80px; flex: 0 0 80px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 26px; background: #ffffff;
        border-bottom: 1px solid #e3e8e5;
      }
      .ne__brand { display: flex; align-items: center; gap: 13px; }
      .ne__logo {
        width: 38px; height: 38px; border-radius: 10px; background: #1f7a4d;
        display: flex; align-items: center; justify-content: center;
      }
      .ne__logo svg { width: 22px; height: 22px; }
      .ne__title { font-size: 25px; font-weight: 700; color: #14503a; letter-spacing: -0.2px; }
      .ne__sub { font-size: 17px; font-weight: 600; color: #64756c; margin-top: 1px; }
      /* The way out of the popup, as the real one has. */
      .ne__x {
        width: 48px; height: 48px; border-radius: 12px;
        border: 1px solid #d7ddd9; background: #fff;
        display: flex; align-items: center; justify-content: center;
      }
      .ne__x svg { width: 22px; height: 22px; }

      /*
       * ===== School Explorer: a photograph of the real product =====
       *
       * Its own popup chrome, drawn as the real one is: a solid accent header
       * with the product's name and a way out. The shot inside is of the embed
       * only, so without this there is no header and no X anywhere in the video.
       */
      .se__head {
        height: 80px; flex: 0 0 80px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 26px; background: #1f7a4d;
      }
      .se__brand { display: flex; align-items: center; gap: 13px; }
      .se__logo {
        width: 38px; height: 38px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex; align-items: center; justify-content: center;
      }
      .se__logo svg { width: 22px; height: 22px; }
      .se__title { font-size: 25px; font-weight: 700; color: #ffffff; letter-spacing: -0.2px; }
      .se__sub { font-size: 17px; font-weight: 600; color: rgba(255, 255, 255, 0.82); margin-top: 1px; }
      .se__x {
        width: 48px; height: 48px; border-radius: 12px;
        background: rgba(255, 255, 255, 0.16);
        display: flex; align-items: center; justify-content: center;
      }
      .se__x svg { width: 22px; height: 22px; }

      /* ===== the photograph itself, for either Explorer ===== */
      .ne__shot, .se__shot {
        display: block; width: 100%; height: 700px;
        object-fit: cover; object-position: top center;
        /* Taken at twice the size, so let the browser downsample it properly. */
        image-rendering: auto;
      }

    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" alt="" />
      <div id="scrim"></div>
      <div id="card"></div>
      <div id="caption"><h1></h1><p></p></div>
      <div id="popup"><div id="tooltip"></div><div id="house"></div></div>
    </div>

    <script>
      const ICONS = {
        house:
          '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/></svg>',
        // The way out of the popup, in its header. Dark on the Neighborhood
        // Explorer's white header, white on the School Explorer's green one.
        close:
          '<svg viewBox="0 0 24 24" fill="none" stroke="#41504a" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>',
        closeLight:
          '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>',
      };

      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"]/g, (ch) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])
        );
      }

      /*
       * The School Explorer card is a photograph of the real product.
       *
       * This used to draw its own card from a fixed list of Smyrna, Georgia
       * schools, so every video showed Cobb County's district whatever address it
       * was about - a Peoria listing included. Now the beat is a screenshot of the
       * live School Explorer opened at this listing's address, taken by
       * src/school-explorer.js, with the popup's own chrome drawn around it: the
       * accent header the real popup has, and a way out of it.
       */
      function seCard(spec) {
        return `
          <div class="se__head">
            <div class="se__brand">
              <div class="se__logo">${ICONS.house}</div>
              <div>
                <div class="se__title">School Explorer</div>
                <div class="se__sub">${esc(spec.address && spec.address.street ? spec.address.street : "")}</div>
              </div>
            </div>
            <div class="se__x">${ICONS.closeLight}</div>
          </div>
          <img class="se__shot" src="${esc(spec.tabImage)}" alt="" />`;
      }

      /*
       * The Neighborhood Explorer card is a photograph of the real product.
       *
       * Each tab beat is a screenshot taken from the live Explorer, opened at
       * this listing's address, with that tab selected. Nothing here is drawn by
       * us, so the highlighted tab and the body underneath it always agree - they
       * are the same picture. An earlier version drew its own card and only moved
       * the tab chip, which left every tab showing Map and Summary.
       */
      function neCard(spec) {
        /*
         * The photograph of the real widget, with the popup's own chrome drawn
         * around it: brand on the left, a way out on the right.
         *
         * The shots are taken of the inner widget (popup=true), so the header and
         * the X are not in them. Without this the card was a white rectangle with
         * no edge and no way out on screen.
         */
        return `
          <div class="ne__head">
            <div class="ne__brand">
              <div class="ne__logo">${ICONS.house}</div>
              <div>
                <div class="ne__title">Neighborhood Explorer</div>
                <div class="ne__sub">${esc(spec.address && spec.address.street ? spec.address.street : "")}</div>
              </div>
            </div>
            <div class="ne__x">${ICONS.close}</div>
          </div>
          <img class="ne__shot" src="${esc(spec.tabImage)}" alt="" />`;
      }

      window.renderFrame = function renderFrame(spec) {
        const stage = document.getElementById("stage");
        const bg = document.getElementById("bg");

        if (bg.getAttribute("src") !== spec.bg) bg.setAttribute("src", spec.bg);
        bg.style.top = `${-(spec.bgOffset || 0)}px`;

        const caption = spec.caption || { headline: "", subline: "" };
        document.querySelector("#caption h1").textContent = caption.headline || "";
        document.querySelector("#caption p").textContent = caption.subline || "";
        stage.classList.toggle("no-caption", !caption.headline && !caption.subline);

        /*
         * A bare listing beat overrules the rest of the spec.
         *
         * Nothing of ours is drawn AND nothing of ours is left in the markup, so
         * a frame that is meant to be their page alone cannot carry our wording
         * even in a node the CSS is hiding.
         */
        const bare = Boolean(spec.bare);
        stage.classList.toggle("bare-listing", bare);

        document.getElementById("tooltip").textContent = bare ? "" : spec.tooltip || "";
        document.getElementById("tooltip").style.display = !bare && spec.tooltip ? "" : "none";
        document.getElementById("house").innerHTML = bare ? "" : ICONS.house;
        document.getElementById("popup").className = !bare && spec.tapping ? "is-tapping" : "";

        const card = document.getElementById("card");
        const wantsCard = !bare && Boolean(spec.card);
        stage.classList.toggle("has-card", wantsCard);
        stage.classList.toggle("hide-popup", bare || Boolean(spec.hidePopup));
        card.className = wantsCard ? `card--${spec.card}` : "";
        if (wantsCard && spec.card === "se") card.innerHTML = seCard(spec);
        else if (wantsCard && spec.card === "ne") card.innerHTML = neCard(spec);
        else card.innerHTML = "";

        /*
         * Wait for the listing behind AND the photograph in the card.
         *
         * Only the background used to be waited for, and the Explorer shot in the
         * card was left to load in whatever time the screenshot took to be asked
         * for. A card photographed before its picture had decoded would come out
         * as an empty white rectangle.
         */
        const pictures = Array.from(document.querySelectorAll("#stage img")).filter((img) => img.getAttribute("src"));
        return Promise.all(
          pictures.map(
            (img) =>
              new Promise((resolve) => {
                if (img.complete) return resolve();
                img.onload = img.onerror = () => resolve();
              })
          )
        ).then(() => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve))));
      };
    </script>
  </body>
</html>
