<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Listing video frame</title>
    <style>
      :root {
        --dn-green: #1f7a4d;
        --dn-green-dark: #17493a;
        --ink: #16202b;
        --ink-soft: #5b6b7b;
        --line: #e3e8ee;
        --amber: #f0932b;
        --red: #e0396b;
        --green: #2fa96b;
        --grey: #9aa7b4;
        --purple: #6d5bd0;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
        font-family: Inter, "Liberation Sans", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f2f4f6; }

      /* ---------- captured website ---------- */
      #bg { position: absolute; top: 0; left: 0; width: 1920px; display: block; }

      #scrim {
        position: absolute; inset: 0;
        background: rgba(255, 255, 255, 0.5);
        opacity: 0;
        transition: none;
      }
      #stage.has-card #scrim { opacity: 1; }

      /* ---------- top caption bar (never a bottom bar: it would cover the popup) ---------- */
      #caption {
        position: absolute; top: 0; left: 0; right: 0; height: 112px;
        background: rgba(26, 56, 43, 0.9);
        padding: 16px 48px 0;
        display: flex; flex-direction: column; justify-content: center;
      }
      /* A beat can leave the caption empty; the bar goes with it. */
      #stage.no-caption #caption { display: none; }
      #caption h1 {
        color: #ffffff; font-size: 44px; font-weight: 800; letter-spacing: -0.6px;
        line-height: 1.08; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #caption p {
        color: rgba(255, 255, 255, 0.86); font-size: 23px; font-weight: 600;
        margin-top: 8px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ---------- popup button, bottom right ---------- */
      #popup {
        position: absolute; right: 40px; bottom: 40px;
        display: flex; align-items: center; gap: 18px;
      }
      #tooltip {
        background: #ffffff; color: #1d2b36; font-size: 25px; font-weight: 600;
        padding: 17px 30px; border-radius: 999px;
        box-shadow: 0 10px 34px rgba(15, 23, 42, 0.22);
        white-space: nowrap; max-width: 1200px; overflow: hidden; text-overflow: ellipsis;
      }
      #house {
        width: 86px; height: 86px; border-radius: 50%;
        background: linear-gradient(180deg, #24855a 0%, #17604180 100%), #1c7148;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 30px rgba(14, 68, 46, 0.4);
        flex: 0 0 auto;
      }
      #house svg { width: 44px; height: 44px; }
      #popup.is-tapping #house {
        box-shadow: 0 0 0 14px rgba(31, 122, 77, 0.28), 0 12px 30px rgba(14, 68, 46, 0.45);
        transform: scale(1.06);
      }
      #stage.hide-popup #popup { display: none; }

      /* ---------- explorer card (same size and place for SE and NE) ---------- */
      #card {
        position: absolute; left: 290px; top: 208px; width: 1340px; height: 764px;
        background: #f6f7f5; border-radius: 16px;
        box-shadow: 0 40px 90px rgba(12, 26, 20, 0.32), 0 2px 0 rgba(255, 255, 255, 0.6) inset;
        overflow: hidden; display: none;
      }
      #stage.has-card #card { display: block; }

      /* ===== School Explorer ===== */
      .se { padding: 26px 30px 0; height: 100%; }
      .se__top { display: flex; align-items: center; justify-content: space-between; }
      .se__brand { display: flex; align-items: center; gap: 12px; }
      .se__logo {
        width: 34px; height: 34px; border-radius: 9px; background: #1f7a4d;
        display: flex; align-items: center; justify-content: center;
      }
      .se__logo svg { width: 20px; height: 20px; }
      .se__brandname { font-size: 21px; font-weight: 700; color: #1f7a4d; }
      .burger { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
        display: flex; align-items: center; justify-content: center; }
      .burger span { display: block; width: 20px; height: 2px; background: #4a5866; box-shadow: 0 6px 0 #4a5866, 0 -6px 0 #4a5866; }

      .heading { display: flex; align-items: center; gap: 14px; margin-top: 26px; }
      .heading__bar { width: 6px; height: 30px; background: #1f7a4d; border-radius: 3px; }
      .heading__text { font-size: 31px; font-weight: 800; color: var(--ink); letter-spacing: -0.4px; }
      .heading__right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
      .heading__count { font-size: 17px; color: var(--ink-soft); font-weight: 500; }

      .se__locrow { display: flex; align-items: stretch; gap: 14px; margin-top: 20px; }
      .pillbtn {
        display: inline-flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line);
        border-radius: 11px; padding: 12px 18px; font-size: 18px; font-weight: 600; color: #2c3a47;
      }
      .pillbtn svg { width: 19px; height: 19px; }
      .se__loc {
        flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 11px;
        padding: 12px 18px; display: flex; align-items: center; gap: 16px;
      }
      .se__loc-main { flex: 1; min-width: 0; }
      .se__loc-line1 { font-size: 19px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .se__loc-line1 .pin { color: var(--red); }
      .se__loc-line2 { font-size: 15px; color: var(--ink-soft); margin-top: 4px; }
      .btn-outline {
        border: 1px solid #b8ddc7; color: #1f7a4d; background: #fff; border-radius: 9px;
        padding: 10px 16px; font-size: 17px; font-weight: 700; white-space: nowrap;
      }

      .filters { display: flex; align-items: center; gap: 28px; margin-top: 18px; }
      .filters__group { display: flex; align-items: center; gap: 10px; }
      .filters__label { font-size: 16px; color: var(--ink-soft); font-weight: 600; }
      .chip {
        border: 1px solid var(--line); background: #fff; color: #4a5866; border-radius: 999px;
        padding: 7px 17px; font-size: 16px; font-weight: 600;
      }
      .chip--on { background: #1f7a4d; border-color: #1f7a4d; color: #fff; }
      .chip--dark { background: #16202b; border-color: #16202b; color: #fff; }

      .schools { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-top: 20px; }
      .school {
        background: #fff; border: 1px solid var(--line); border-radius: 13px;
        display: flex; align-items: stretch; overflow: hidden; min-height: 96px;
      }
      .school__score {
        width: 82px; flex: 0 0 82px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; color: #fff; position: relative; padding: 6px;
      }
      .school__score--amber { background: var(--amber); }
      .school__score--red { background: var(--red); }
      .school__score--green { background: var(--green); }
      .school__score--grey { background: #aab5c0; }
      .school__score-num { font-size: 30px; font-weight: 800; line-height: 1; }
      .school__score-den { font-size: 14px; font-weight: 600; opacity: 0.92; margin-top: 2px; }
      .school__score-nr { font-size: 13px; font-weight: 800; line-height: 1.1; text-align: center; letter-spacing: 0.2px; }
      .school__rank {
        position: absolute; top: 5px; left: 7px; font-size: 13px; font-weight: 800; opacity: 0.95;
      }
      .school__body { flex: 1; min-width: 0; padding: 13px 14px; }
      .school__name { font-size: 19px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .school__private {
        display: inline-block; background: #efeaff; color: var(--purple); font-size: 11px; font-weight: 800;
        letter-spacing: 0.6px; border-radius: 5px; padding: 3px 7px; margin-right: 8px; vertical-align: 2px;
      }
      .school__meta { font-size: 15px; color: var(--ink-soft); margin-top: 5px; }
      .school__foot { font-size: 15px; font-weight: 600; margin-top: 7px; display: flex; align-items: center; gap: 10px; }
      .school__rating--amber { color: #d97e14; }
      .school__rating--red { color: #d02f5f; }
      .school__rating--grey { color: var(--grey); }
      .school__dist { color: var(--ink-soft); font-weight: 500; }
      .school__compare {
        width: 84px; flex: 0 0 84px; border-left: 1px solid #f0f3f6;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
      }
      .school__box { width: 19px; height: 19px; border: 2px solid #cbd5e0; border-radius: 4px; }
      .school__compare span { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

      /* ===== Neighborhood Explorer: a photograph of the real product ===== */
      .ne__shot { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }

    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" alt="" />
      <div id="scrim"></div>
      <div id="card"></div>
      <div id="caption"><h1></h1><p></p></div>
      <div id="popup"><div id="tooltip"></div><div id="house"></div></div>
    </div>

    <script>
      const ICONS = {
        house:
          '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/></svg>',
        houseGreen:
          '<svg viewBox="0 0 24 24" fill="none" stroke="#1f7a4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/></svg>',
      };

      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"]/g, (ch) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])
        );
      }

      function seCard(spec) {
        const demo = spec.demo;
        const rows = spec.schools
          .map((school) => {
            const score =
              school.score === "NOT RATED"
                ? '<div class="school__score-nr">NOT<br />RATED</div>'
                : `<div class="school__score-num">${esc(school.score)}</div><div class="school__score-den">/ 10</div>`;
            const privateChip = school.private ? '<span class="school__private">PRIVATE</span>' : "";
            return `
              <div class="school">
                <div class="school__score school__score--${esc(school.tone)}">
                  <div class="school__rank">${esc(school.rank)}</div>${score}
                </div>
                <div class="school__body">
                  <div class="school__name">${privateChip}${esc(school.name)}</div>
                  <div class="school__meta">${esc(school.meta)}</div>
                  <div class="school__foot">
                    <span class="school__rating--${esc(school.ratingTone)}">${esc(school.rating)}</span>
                    <span class="school__dist">&#9678; ${esc(school.distance)}</span>
                  </div>
                </div>
                <div class="school__compare"><div class="school__box"></div><span>Compare</span></div>
              </div>`;
          })
          .join("");

        return `
          <div class="se">
            <div class="se__top">
              <div class="se__brand">
                <div class="se__logo">${ICONS.house}</div>
                <div class="se__brandname">Dream Neighborhood</div>
              </div>
              <div class="burger"><span></span></div>
            </div>

            <div class="heading">
              <div class="heading__bar"></div>
              <div class="heading__text">Find Your Dream School</div>
            </div>

            <div class="se__locrow">
              <div class="pillbtn">${ICONS.houseGreen}<span>Home</span></div>
              <div class="se__loc">
                <div class="se__loc-main">
                  <div class="se__loc-line1"><span class="pin">&#9679;</span> ${esc(demo.cityState)} &middot; ${esc(demo.district)}</div>
                  <div class="se__loc-line2">${esc(demo.schoolsNearby)} schools nearby &middot; ${esc(demo.students)} students (public + private)</div>
                </div>
                <div class="btn-outline">Change address</div>
              </div>
            </div>

            <div class="heading">
              <div class="heading__bar"></div>
              <div class="heading__text" style="font-size: 27px">Schools near you</div>
              <div class="heading__right">
                <span class="heading__count">12 of ${esc(demo.schoolsNearby)} nearest</span>
                <span class="chip chip--dark">List</span>
                <span class="chip">Map</span>
              </div>
            </div>

            <div class="filters">
              <div class="filters__group">
                <span class="filters__label">Sort</span>
                <span class="chip chip--on">Distance</span>
                <span class="chip">Rating</span>
              </div>
              <div class="filters__group">
                <span class="filters__label">Show</span>
                <span class="chip chip--on">All</span>
                <span class="chip">Public</span>
                <span class="chip">Private</span>
              </div>
            </div>

            <div class="schools">${rows}</div>
          </div>`;
      }

      /*
       * The Neighborhood Explorer card is a photograph of the real product.
       *
       * Each tab beat is a screenshot taken from the live Explorer, opened at
       * this listing's address, with that tab selected. Nothing here is drawn by
       * us, so the highlighted tab and the body underneath it always agree - they
       * are the same picture. An earlier version drew its own card and only moved
       * the tab chip, which left every tab showing Map and Summary.
       */
      function neCard(spec) {
        return `<img class="ne__shot" src="${esc(spec.tabImage)}" alt="" />`;
      }

      window.renderFrame = function renderFrame(spec) {
        const stage = document.getElementById("stage");
        const bg = document.getElementById("bg");

        if (bg.getAttribute("src") !== spec.bg) bg.setAttribute("src", spec.bg);
        bg.style.top = `${-(spec.bgOffset || 0)}px`;

        const caption = spec.caption || { headline: "", subline: "" };
        document.querySelector("#caption h1").textContent = caption.headline || "";
        document.querySelector("#caption p").textContent = caption.subline || "";
        stage.classList.toggle("no-caption", !caption.headline && !caption.subline);

        document.getElementById("tooltip").textContent = spec.tooltip || "";
        document.getElementById("tooltip").style.display = spec.tooltip ? "" : "none";
        document.getElementById("house").innerHTML = ICONS.house;
        document.getElementById("popup").className = spec.tapping ? "is-tapping" : "";

        const card = document.getElementById("card");
        stage.classList.toggle("has-card", Boolean(spec.card));
        stage.classList.toggle("hide-popup", Boolean(spec.hidePopup));
        if (spec.card === "se") card.innerHTML = seCard(spec);
        else if (spec.card === "ne") card.innerHTML = neCard(spec);
        else card.innerHTML = "";

        return new Promise((resolve) => {
          if (bg.complete) requestAnimationFrame(() => requestAnimationFrame(resolve));
          else bg.onload = bg.onerror = () => requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      };
    </script>
  </body>
</html>
